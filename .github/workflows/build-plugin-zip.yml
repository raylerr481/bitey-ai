name: Build Bitey AI WordPress Plugin

on:
  workflow_dispatch:
  push:
    branches: [main, feat/company-profile-globe]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          php -v
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Prepare production plugin
        run: |
          rm -rf dist
          mkdir -p dist/bitey-ai/includes dist/bitey-ai/assets/css dist/bitey-ai/assets/js
          cp bitey-ai.php dist/bitey-ai/
          cp includes/class-bitey-api.php dist/bitey-ai/includes/
          cp includes/class-bitey-assets.php dist/bitey-ai/includes/
          cp includes/class-bitey-settings.php dist/bitey-ai/includes/
          cp includes/class-bitey-widget.php dist/bitey-ai/includes/
          cp assets/css/bitey-style.css dist/bitey-ai/assets/css/
          cp assets/js/bitey.js dist/bitey-ai/assets/js/

      - name: Validate WordPress plugin
        run: |
          test -f dist/bitey-ai/bitey-ai.php
          grep -q '^Plugin Name:' dist/bitey-ai/bitey-ai.php
          grep -q '^Version: 2.5.0' dist/bitey-ai/bitey-ai.php
          grep -q "define('BITEY_VERSION','2.5.0')" dist/bitey-ai/bitey-ai.php
          grep -q "wp_verify_nonce" dist/bitey-ai/includes/class-bitey-api.php
          grep -q "company-profile/import" dist/bitey-ai/includes/class-bitey-api.php
          grep -q "bitey_import_company" dist/bitey-ai/assets/js/bitey.js
          test -f dist/bitey-ai/includes/class-bitey-api.php
          test -f dist/bitey-ai/includes/class-bitey-assets.php
          test -f dist/bitey-ai/includes/class-bitey-settings.php
          test -f dist/bitey-ai/includes/class-bitey-widget.php
          test -f dist/bitey-ai/assets/css/bitey-style.css
          test -f dist/bitey-ai/assets/js/bitey.js
          count=$(find dist/bitey-ai -type f | wc -l)
          test "$count" -eq 7

      - name: Build ZIP
        run: |
          cd dist
          zip -r ../bitey-ai-2.5.0-wordpress.zip bitey-ai
          cd ..
          unzip -t bitey-ai-2.5.0-wordpress.zip

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bitey-ai-2.5.0-wordpress
          path: bitey-ai-2.5.0-wordpress.zip
          if-no-files-found: error
